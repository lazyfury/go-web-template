# 本地开发 / 生产部署编排
# 用法：
#   docker compose up -d postgres   # 只起数据库
#   docker compose up -d            # 起数据库 + 迁移 + 应用
name: go-web-template

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_web_template
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_web_template"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性迁移任务：goose/golang-migrate 官方镜像执行 migrations/ 下的 SQL。
  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:postgres@postgres:5432/go_web_template?sslmode=disable"
      - "up"
    restart: "no"

  app:
    build:
      # compose 的相对路径以本文件目录为基准，构建上下文必须是仓库根。
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      # 迁移成功后才启动应用，保证新卷上不会出现"库没表"。
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_PORT: "8080"
      APP_DATABASE_HOST: postgres
      APP_DATABASE_PORT: "5432"
      APP_DATABASE_USER: postgres
      APP_DATABASE_PASSWORD: postgres
      APP_DATABASE_DBNAME: go_web_template
      APP_LOG_LEVEL: info
      APP_LOG_FORMAT: json
      # 生产环境务必收紧 CORS 与限流
      # 本地编排默认放行 vite dev server；跨域 + refresh cookie 必须同时
      # 使用具体来源（不能用 *）并打开 allow_credentials。
      # 生产改成真实前端域名，见 README「生产环境建议」。
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      APP_CORS_ALLOW_CREDENTIALS: "${APP_CORS_ALLOW_CREDENTIALS:-true}"
      # 生产式编排默认关闭 OpenAPI/Swagger；本地调试用 APP_SWAGGER_ENABLED=true make docker-up
      APP_SWAGGER_ENABLED: "${APP_SWAGGER_ENABLED:-false}"
      # JWT 签名密钥：**必须由外部注入**（>=32 字节随机值）。
      # 这里故意不提供可用默认值：仓库里自带的默认值 = 公开密钥，任何能读到
      # 仓库的人都能用它自签 admin token（历史版本踩过这个坑）。
      # 留空时应用会在启动时 fail-fast 报 auth.jwt_secret must be at least 32 bytes。
      # 本地编排：`make docker-up` 会自动生成并复用 .local/jwt-secret。
      APP_AUTH_JWT_SECRET: "${APP_AUTH_JWT_SECRET:-}"
      # 默认 true（这是会随编排进生产的那份配置）：Secure cookie 只能走 https。
      # 本地 http 调试由 `make docker-up` 显式注入 false（浏览器才会回传 refresh
      # cookie）；手工 `docker compose up` 且用浏览器直连 http 时同样需要显式置 false。
      APP_AUTH_COOKIE_SECURE: "${APP_AUTH_COOKIE_SECURE:-true}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
