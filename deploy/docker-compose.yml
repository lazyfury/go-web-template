# 本地开发 / 生产部署编排
# 用法：
#   docker compose up -d postgres   # 只起数据库
#   docker compose up -d            # 起数据库 + 迁移 + 应用
name: go-web-template

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_web_template
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_web_template"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 跨副本共享状态（限流桶）。Redis 不是事实来源：DB 永远权威，Redis 只在
  # ratelimit.backend=redis 时承载多副本共享的 token bucket。
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性迁移任务：goose/golang-migrate 官方镜像执行 migrations/ 下的 SQL。
  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:postgres@postgres:5432/go_web_template?sslmode=disable"
      - "up"
    restart: "no"

  app:
    build:
      # compose 的相对路径以本文件目录为基准，构建上下文必须是仓库根。
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      # 迁移成功后才启动应用，保证新卷上不会出现"库没表"。
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_PORT: "8080"
      APP_DATABASE_HOST: postgres
      APP_DATABASE_PORT: "5432"
      APP_DATABASE_USER: postgres
      APP_DATABASE_PASSWORD: postgres
      APP_DATABASE_DBNAME: go_web_template
      APP_LOG_LEVEL: info
      APP_LOG_FORMAT: json
      # 限流桶放 Redis：多副本时每个进程各有一份额度是错的（见 context.md §11）。
      # 单机跑也可以切回 memory：APP_RATELIMIT_BACKEND=memory。
      APP_RATELIMIT_BACKEND: "${APP_RATELIMIT_BACKEND:-redis}"
      APP_REDIS_ADDR: "${APP_REDIS_ADDR:-redis:6379}"
      # 生产环境务必收紧 CORS 与限流
      # 本地编排默认放行 vite dev server；跨域 + refresh cookie 必须同时
      # 使用具体来源（不能用 *）并打开 allow_credentials。
      # 生产改成真实前端域名，见 README「生产环境建议」。
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      APP_CORS_ALLOW_CREDENTIALS: "${APP_CORS_ALLOW_CREDENTIALS:-true}"
      # 生产式编排默认关闭 OpenAPI/Swagger；本地调试用 APP_SWAGGER_ENABLED=true make docker-up
      APP_SWAGGER_ENABLED: "${APP_SWAGGER_ENABLED:-false}"
      # /metrics 会暴露 Go 版本、路由清单与流量画像：默认关闭，抓取走内网/反代 ACL。
      # 本地需要 Prometheus 抓取时 APP_METRICS_ENABLED=true make docker-up
      APP_METRICS_ENABLED: "${APP_METRICS_ENABLED:-false}"
      # JWT 签名密钥：**必须由外部注入**（>=32 字节随机值）。
      # 这里故意不提供可用默认值：仓库里自带的默认值 = 公开密钥，任何能读到
      # 仓库的人都能用它自签 admin token（历史版本踩过这个坑）。
      # 留空时应用会在启动时 fail-fast（APP_AUTH_JWT_SECRET 显式为空的按「没设置」
      # 处理，不会回落到 configs/config.yaml 的开发占位值）。
      # 本地编排：`make docker-up` 会自动生成并复用 .local/jwt-secret。
      # 这里用 `${VAR:-}` 而不是 compose 的必填语法 `${VAR:?}`：后者在解析期报错，
      # 会让 `make db-up` / `make smoke` / `docker compose down` 这些只需要 DB 的
      # 命令一起失败。
      APP_AUTH_JWT_SECRET: "${APP_AUTH_JWT_SECRET:-}"
      # 密钥轮换：新密钥走 JWT_SECRET，旧密钥暂放 JWT_RETIRED_SECRETS（只验不签，
      # 逗号分隔）；JWT_KEY_ID 会写进新 token 的 kid 头，方便排查是哪把密钥签的。
      # 旧密钥放够 auth.access_ttl（默认 15m）就可以从列表里删掉了。
      APP_AUTH_JWT_KEY_ID: "${APP_AUTH_JWT_KEY_ID:-}"
      APP_AUTH_JWT_RETIRED_SECRETS: "${APP_AUTH_JWT_RETIRED_SECRETS:-}"
      # 默认 true（这是会随编排进生产的那份配置）：Secure cookie 只能走 https。
      # 本地 http 调试由 `make docker-up` 显式注入 false（浏览器才会回传 refresh
      # cookie）；手工 `docker compose up` 且用浏览器直连 http 时同样需要显式置 false。
      APP_AUTH_COOKIE_SECURE: "${APP_AUTH_COOKIE_SECURE:-true}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
