# 本地开发 / 生产部署编排
# 用法：
#   docker compose up -d postgres   # 只起数据库
#   docker compose up -d            # 起数据库 + 迁移 + 应用
name: go-web-template

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_web_template
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_web_template"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性迁移任务：goose/golang-migrate 官方镜像执行 migrations/ 下的 SQL。
  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:postgres@postgres:5432/go_web_template?sslmode=disable"
      - "up"
    profiles: ["migrate"]

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_PORT: "8080"
      APP_DATABASE_HOST: postgres
      APP_DATABASE_PORT: "5432"
      APP_DATABASE_USER: postgres
      APP_DATABASE_PASSWORD: postgres
      APP_DATABASE_DBNAME: go_web_template
      APP_LOG_LEVEL: info
      APP_LOG_FORMAT: json
      # 生产环境务必收紧 CORS 与限流
      APP_CORS_ALLOWED_ORIGINS: "https://example.com"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
