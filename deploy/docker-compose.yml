# 本地开发 / 生产部署编排
# 用法：
#   docker compose up -d postgres   # 只起数据库
#   docker compose up -d            # 起数据库 + 迁移 + 应用
name: go-web-template

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_web_template
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_web_template"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 跨副本共享状态（限流桶）。Redis 不是事实来源：DB 永远权威，Redis 只在
  # ratelimit.backend=redis 时承载多副本共享的 token bucket。
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性迁移任务：goose/golang-migrate 官方镜像执行 migrations/ 下的 SQL。
  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:postgres@postgres:5432/go_web_template?sslmode=disable"
      - "up"
    restart: "no"

  app:
    build:
      # compose 的相对路径以本文件目录为基准，构建上下文必须是仓库根。
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      # 迁移成功后才启动应用，保证新卷上不会出现"库没表"。
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_PORT: "8080"
      APP_DATABASE_HOST: postgres
      APP_DATABASE_PORT: "5432"
      APP_DATABASE_USER: postgres
      APP_DATABASE_PASSWORD: postgres
      APP_DATABASE_DBNAME: go_web_template
      APP_LOG_LEVEL: info
      APP_LOG_FORMAT: json
      # 限流桶放 Redis：多副本时每个进程各有一份额度是错的（见 context.md §11）。
      # 单机跑也可以切回 memory：APP_RATELIMIT_BACKEND=memory。
      APP_RATELIMIT_BACKEND: "${APP_RATELIMIT_BACKEND:-redis}"
      APP_REDIS_ADDR: "${APP_REDIS_ADDR:-redis:6379}"
      # 生产环境务必收紧 CORS 与限流
      # 本地编排默认放行 vite dev server；跨域 + refresh cookie 必须同时
      # 使用具体来源（不能用 *）并打开 allow_credentials。
      # 生产改成真实前端域名，见 README「生产环境建议」。
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      APP_CORS_ALLOW_CREDENTIALS: "${APP_CORS_ALLOW_CREDENTIALS:-true}"
      # 生产式编排默认关闭 OpenAPI/Swagger；本地调试用 APP_SWAGGER_ENABLED=true make docker-up
      APP_SWAGGER_ENABLED: "${APP_SWAGGER_ENABLED:-false}"
      # /metrics 会暴露 Go 版本、路由清单与流量画像：默认关闭，抓取走内网/反代 ACL。
      # 本地需要 Prometheus 抓取时 APP_METRICS_ENABLED=true make docker-up
      APP_METRICS_ENABLED: "${APP_METRICS_ENABLED:-false}"
      # OpenTelemetry 追踪：默认关闭；make observability-up 注入 true + tempo:4317。
      APP_OTEL_ENABLED: "${APP_OTEL_ENABLED:-false}"
      APP_OTEL_ENDPOINT: "${APP_OTEL_ENDPOINT:-}"
      APP_OTEL_INSECURE: "${APP_OTEL_INSECURE:-true}"
      APP_OTEL_SAMPLE_RATIO: "${APP_OTEL_SAMPLE_RATIO:-1.0}"
      # JWT 签名密钥：**必须由外部注入**（>=32 字节随机值）。
      # 这里故意不提供可用默认值：仓库里自带的默认值 = 公开密钥，任何能读到
      # 仓库的人都能用它自签 admin token（历史版本踩过这个坑）。
      # 留空时应用会在启动时 fail-fast（APP_AUTH_JWT_SECRET 显式为空的按「没设置」
      # 处理，不会回落到 configs/config.yaml 的开发占位值）。
      # 本地编排：`make docker-up` 会自动生成并复用 .local/jwt-secret。
      # 这里用 `${VAR:-}` 而不是 compose 的必填语法 `${VAR:?}`：后者在解析期报错，
      # 会让 `make db-up` / `make smoke` / `docker compose down` 这些只需要 DB 的
      # 命令一起失败。
      APP_AUTH_JWT_SECRET: "${APP_AUTH_JWT_SECRET:-}"
      # 密钥轮换：新密钥走 JWT_SECRET，旧密钥暂放 JWT_RETIRED_SECRETS（只验不签，
      # 逗号分隔）；JWT_KEY_ID 会写进新 token 的 kid 头，方便排查是哪把密钥签的。
      # 旧密钥放够 auth.access_ttl（默认 15m）就可以从列表里删掉了。
      APP_AUTH_JWT_KEY_ID: "${APP_AUTH_JWT_KEY_ID:-}"
      APP_AUTH_JWT_RETIRED_SECRETS: "${APP_AUTH_JWT_RETIRED_SECRETS:-}"
      # 默认 true（这是会随编排进生产的那份配置）：Secure cookie 只能走 https。
      # 本地 http 调试由 `make docker-up` 显式注入 false（浏览器才会回传 refresh
      # cookie）；手工 `docker compose up` 且用浏览器直连 http 时同样需要显式置 false。
      APP_AUTH_COOKIE_SECURE: "${APP_AUTH_COOKIE_SECURE:-true}"
      # 文件存储：默认本地磁盘（挂载 uploads 卷），换成 S3 兼容后端时把 driver 改成 s3
      # 并填 endpoint/region/bucket（凭证走环境变量或 IAM，不要写进本文件）。
      APP_STORAGE_DRIVER: "${APP_STORAGE_DRIVER:-local}"
      APP_STORAGE_MAX_UPLOAD_BYTES: "${APP_STORAGE_MAX_UPLOAD_BYTES:-10485760}"
      APP_STORAGE_LOCAL_ROOT: "${APP_STORAGE_LOCAL_ROOT:-/app/.local/uploads}"
      # 签名下载 URL 的绝对前缀，必须是浏览器可达的 origin（反代域名）。
      APP_STORAGE_LOCAL_BASE_URL: "${APP_STORAGE_LOCAL_BASE_URL:-http://localhost:8080}"
      # 本地下载 URL 的 HMAC 密钥：和 JWT 密钥一样必须外部注入（生产校验会拒绝占位值）。
      # 本地编排由 `make docker-up` 生成并复用 .local/storage-secret。
      APP_STORAGE_SIGNING_SECRET: "${APP_STORAGE_SIGNING_SECRET:-}"
      APP_STORAGE_S3_ENDPOINT: "${APP_STORAGE_S3_ENDPOINT:-}"
      APP_STORAGE_S3_REGION: "${APP_STORAGE_S3_REGION:-us-east-1}"
      APP_STORAGE_S3_BUCKET: "${APP_STORAGE_S3_BUCKET:-}"
      APP_STORAGE_S3_USE_PATH_STYLE: "${APP_STORAGE_S3_USE_PATH_STYLE:-false}"
      # 长期公开资产链接的前缀（CDN/反代 origin）；空 = 回落到 local.base_url。
      APP_STORAGE_ASSETS_BASE_URL: "${APP_STORAGE_ASSETS_BASE_URL:-}"
      APP_STORAGE_ASSETS_CACHE_TTL: "${APP_STORAGE_ASSETS_CACHE_TTL:-24h}"
      # 上传保护：按用户限流 + 24h 配额（0 = 不限）。
      APP_STORAGE_UPLOAD_RPS: "${APP_STORAGE_UPLOAD_RPS:-2}"
      APP_STORAGE_UPLOAD_BURST: "${APP_STORAGE_UPLOAD_BURST:-10}"
      APP_STORAGE_UPLOAD_DAILY_FILES: "${APP_STORAGE_UPLOAD_DAILY_FILES:-200}"
      APP_STORAGE_UPLOAD_DAILY_BYTES: "${APP_STORAGE_UPLOAD_DAILY_BYTES:-104857600}"
    ports:
      - "8080:8080"
    # 运行时加固：镜像里的 /app 只读即可（配置在构建期复制），降权 + 禁提权 +
    # 丢弃全部 capability。写操作只有日志（stdout）与数据库。
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # 本地文件驱动唯一需要可写的路径（compose 的 read_only 不包含挂载点）。
      - uploads:/app/.local/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 优雅停机窗口要覆盖 http.shutdown_timeout（默认 10s）+ 在途请求。
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---- 可观测性（可选，compose profile） -------------------------------------
  # `make observability-up` 会带 --profile observability 并打开 APP_METRICS_ENABLED，
  # 告警规则与看板由 deploy/ 下的文件自动装载（不是三选一：/metrics → Prometheus →
  # Grafana 是一条链，任一层都可以单独用）。
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.15.1
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    security_opt:
      - no-new-privileges:true

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempodata:/var/tempo
    ports:
      - "4317:4317"   # OTLP gRPC（app 的 APP_OTEL_ENDPOINT）
      - "4318:4318"   # OTLP HTTP
      - "3200:3200"   # Tempo HTTP API / Grafana 数据源
    security_opt:
      - no-new-privileges:true

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.3.0
    depends_on:
      - prometheus
    environment:
      # 本地演示：匿名只读，免登录看板。生产请关掉匿名并用 SSO/强密码。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/go-web-template.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/go-web-template.json:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  uploads:
  promdata:
  grafanadata:
  tempodata:
