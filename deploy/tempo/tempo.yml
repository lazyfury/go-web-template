# 本地 Tempo：只做 OTLP 接收 + 本机文件存储，供 `make observability-up` 看 trace。
# 生产请换成对象存储（S3/GCS）+ 独立 compactor，并按保留期配置 block_retention。
server:
  http_listen_port: 3200
  log_level: warn
stream_over_http_enabled: true

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 24h

usage_report:
  reporting_enabled: false
