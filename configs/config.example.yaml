# go-web-template 配置模板：复制为 config.yaml 或通过环境变量覆盖
# 所有键均可用环境变量覆盖，前缀 APP_，例如：
#   APP_DATABASE_PASSWORD=secret APP_LOG_LEVEL=debug go run ./cmd/server
app:
  name: go-web-template
  env: development
  debug: true
  port: 8080

http:
  read_timeout: 10s
  # header 阶段的单独超时：slowloris 不能靠一点点发头把连接挂到 read_timeout（上限 = read_timeout）
  read_header_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s
  request_timeout: 15s
  max_body_bytes: 1048576  # 1 MiB
  # 可信反向代理（IP/CIDR，逗号分隔）。默认空 = 不信任任何代理：客户端 IP 取 TCP 对端，
  # X-Forwarded-For 一律忽略。否则调用方可自选限流桶、伪造访问日志里的 IP。
  # 部署在 nginx/traefik 之后时填代理网段，例如 ["10.0.0.0/8"]。
  trusted_proxies: []

database:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: CHANGE_ME
  dbname: go_web_template
  sslmode: disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h
  log_level: warn

log:
  level: info
  format: json

cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization
    - X-Request-ID
  exposed_headers:
    - X-Request-ID
  allow_credentials: false
  max_age: 12h

ratelimit:
  enabled: true
  rps: 100
  burst: 200

swagger:
  enabled: true

metrics:
  # Prometheus 抓取端点 /metrics（含 Go 版本、路由清单与流量画像）。
  # 默认开启；公网部署请关掉（APP_METRICS_ENABLED=false）或让反代只放行抓取方。
  enabled: true

auth:
  # HS256 签名密钥：生产环境必填且 >=32 字节（APP_AUTH_JWT_SECRET），开发环境可用默认值
  jwt_secret: CHANGE_ME_use_a_random_32+_byte_secret
  # 轮换：新签发的 token 头里带 kid=<jwt_key_id>；旧密钥放 jwt_retired_secrets
  # （只验不签，逗号分隔），等 access_ttl 过去后再从列表里删掉。留空 = 不轮换。
  jwt_key_id: ""
  jwt_retired_secrets: []
  issuer: go-web-template
  access_ttl: 15m
  # 滑动续期：每次 /auth/refresh 都会续到 30 天，活跃用户不会被迫重登
  refresh_ttl: 720h
  # 会话绝对上限：从首次登录算起最多 90 天（到点强制重登）
  refresh_max_lifetime: 2160h
  # 轮换后的旧 token 在 30s 内重放视为多标签页竞态（容忍），超出则按盗用处理
  refresh_reuse_interval: 30s
  bcrypt_cost: 12
  # 认证校验缓存：每请求少一次用户行读；本进程写立即失效，多副本最多滞后一个 TTL。
  # 0 = 关闭（每请求一次 DB 读）。上限 1m。
  verify_cache_ttl: 5s
  login_max_attempts: 5
  login_lockout: 15m
  login_rps: 5
  login_burst: 10
  # 改密端点按用户限流（每次都要 bcrypt 校验当前密码）：突发 5 次，之后每 5 秒 1 次
  password_rps: 0.2
  password_burst: 5
  # 本地 http 调试时置 false，否则浏览器不会保存 refresh cookie
  cookie_secure: true


message:
  # 后台投递 worker 由 cmd/server 启动；关闭后 delivery 会停留在 pending
  worker_enabled: true
  poll_interval: 5s
  batch_size: 50
  lease: 2m
  retry_base: 30s
  delivery_timeout: 30s
  # Webhook 白名单；为空表示禁用 webhook 渠道
  webhook_urls: []
  webhook_secret: ""
  webhook_allow_private: false
  # 邮件：host 为空表示禁用
  mail:
    host: ""
    port: 587
    username: ""
    password: ""
    from: ""
  # 短信：provider 为空表示禁用（当前支持 twilio）
  sms:
    provider: ""
    account_sid: ""
    auth_token: ""
    from: ""
    endpoint: ""
  default_locale: zh-CN
  max_attempts: 5
