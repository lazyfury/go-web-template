# go-web-template 默认开发配置
# 优先级：默认值 < 本文件 < 环境变量（前缀 APP_，如 APP_DATABASE_HOST）
app:
  name: go-web-template
  env: development          # development | staging | production
  debug: true
  port: 8080

http:
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s
  request_timeout: 15s
  max_body_bytes: 1048576  # 1 MiB

database:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres
  dbname: go_web_template
  sslmode: disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h
  log_level: warn          # silent | error | warn | info

log:
  level: info              # debug | info | warn | error
  format: json             # json | console

cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization
    - X-Request-ID
  exposed_headers:
    - X-Request-ID
  allow_credentials: false
  max_age: 12h

ratelimit:
  enabled: true
  rps: 100
  burst: 200

swagger:
  enabled: true
