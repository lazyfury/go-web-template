# go-web-template 默认开发配置
# 优先级：默认值 < 本文件 < 环境变量（前缀 APP_，如 APP_DATABASE_HOST）
app:
  name: go-web-template
  env: development          # development | staging | production
  debug: true
  port: 8080

http:
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s
  request_timeout: 15s
  max_body_bytes: 1048576  # 1 MiB
  # 可信反向代理（IP/CIDR，逗号分隔）。默认空 = 不信任任何代理：客户端 IP 取 TCP 对端，
  # X-Forwarded-For 一律忽略。否则调用方可自选限流桶、伪造访问日志里的 IP。
  # 部署在 nginx/traefik 之后时填代理网段，例如 ["10.0.0.0/8"]。
  trusted_proxies: []

database:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres
  dbname: go_web_template
  sslmode: disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h
  log_level: warn          # silent | error | warn | info

log:
  level: info              # debug | info | warn | error
  format: json             # json | console

cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization
    - X-Request-ID
  exposed_headers:
    - X-Request-ID
  allow_credentials: false
  max_age: 12h

ratelimit:
  enabled: true
  rps: 100
  burst: 200
  # 桶放哪里：memory = 每进程一份（单实例正确）；redis = 多副本共享。
  # 多副本部署必须用 redis，否则每个副本各有一份额度，等于把限额乘以副本数。
  backend: memory

# Redis 只在 ratelimit.backend=redis 时使用（不是事实来源，DB 永远权威）。
redis:
  addr: ""              # 空 + backend=redis 会在启动时 fail-fast
  password: ""
  db: 0
  pool_size: 10
  dial_timeout: 2s      # 同时作为读写超时：Redis 卡住时快速失败（限流 fail-open）
  ping_timeout: 1s      # 启动连通性检查

swagger:
  enabled: true

metrics:
  # Prometheus 抓取端点 /metrics（含 Go 版本、路由清单与流量画像）。
  # 默认开启；公网部署请关掉（APP_METRICS_ENABLED=false）或让反代只放行抓取方。
  enabled: true

auth:
  # HS256 签名密钥：生产环境必填且 >=32 字节（APP_AUTH_JWT_SECRET），开发环境可用默认值
  jwt_secret: dev-only-insecure-secret-change-me-32b
  # 轮换：新签发的 token 头里带 kid=<jwt_key_id>；旧密钥放 jwt_retired_secrets
  # （只验不签），等 access_ttl 过去后再从列表里删掉。留空 = 不轮换。
  jwt_key_id: ""
  jwt_retired_secrets: []
  issuer: go-web-template
  access_ttl: 15m
  # 滑动续期：每次 /auth/refresh 都会续到 30 天，活跃用户不会被迫重登
  refresh_ttl: 720h
  # 会话绝对上限：从首次登录算起最多 90 天（到点强制重登）
  refresh_max_lifetime: 2160h
  # 轮换后的旧 token 在 30s 内重放视为多标签页竞态（容忍），超出则按盗用处理
  refresh_reuse_interval: 30s
  bcrypt_cost: 12
  login_max_attempts: 5
  login_lockout: 15m
  login_rps: 5
  login_burst: 10
  # 改密端点按用户限流（每次都要 bcrypt 校验当前密码）：突发 5 次，之后每 5 秒 1 次
  password_rps: 0.2
  password_burst: 5
  # 镜像里烘焙的默认值必须是 true：这是会随镜像进生产的那份配置。
  # 本地 http 调试由 make dev / make run / make docker-up / smoke.sh 注入
  # APP_AUTH_COOKIE_SECURE=false（Secure cookie 在 http 上不会回传，
  # 表现为「登录成功但刷新页面就掉线」）。手工 docker compose up 时 compose
  # 同样默认 true，需要自己 export false。
  cookie_secure: true


message:
  # 后台投递 worker 由 cmd/server 启动；关闭后 delivery 会停留在 pending
  worker_enabled: true
  poll_interval: 5s
  batch_size: 50
  lease: 2m
  retry_base: 30s
  delivery_timeout: 30s
  webhook_urls: []
  webhook_secret: ""
  webhook_allow_private: false
  mail:
    host: ""
    port: 587
    username: ""
    password: ""
    from: ""
  sms:
    provider: ""
    account_sid: ""
    auth_token: ""
    from: ""
    endpoint: ""
  default_locale: zh-CN
  max_attempts: 5

retention:
  # 保留期清理 worker（housekeeping）：cmd/server 启动，按窗口硬删除过期行。
  # 关闭后表会无界增长；窗口都从「可清理时刻」起算（token/消息=过期时间，
  # 终态投递=最后更新时间），所以再过一段宽限期才真正删除。
  enabled: true
  interval: 1h
  timeout: 1m                  # 单个任务的上限，避免大 DELETE 长时间占用
  refresh_token_retention: 168h   # 过期后再留 7 天（重放判定仍有明确答案）
  delivery_retention: 720h        # sent/dead/canceled 保留 30 天；pending/可重试永不删
  message_retention: 2160h        # 消息自身 expires_at 之后再留 90 天；无 expires_at 永不删
