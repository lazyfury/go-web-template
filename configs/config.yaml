# go-web-template 默认开发配置
# 优先级：默认值 < 本文件 < 环境变量（前缀 APP_，如 APP_DATABASE_HOST）
app:
  name: go-web-template
  env: development          # development | staging | production
  debug: true
  port: 8080

http:
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s
  request_timeout: 15s
  max_body_bytes: 1048576  # 1 MiB

database:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres
  dbname: go_web_template
  sslmode: disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h
  log_level: warn          # silent | error | warn | info

log:
  level: info              # debug | info | warn | error
  format: json             # json | console

cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization
    - X-Request-ID
  exposed_headers:
    - X-Request-ID
  allow_credentials: false
  max_age: 12h

ratelimit:
  enabled: true
  rps: 100
  burst: 200

swagger:
  enabled: true

auth:
  # HS256 签名密钥：生产环境必填且 >=32 字节（APP_AUTH_JWT_SECRET），开发环境可用默认值
  jwt_secret: dev-only-insecure-secret-change-me-32b
  issuer: go-web-template
  access_ttl: 15m
  # 滑动续期：每次 /auth/refresh 都会续到 30 天，活跃用户不会被迫重登
  refresh_ttl: 720h
  # 会话绝对上限：从首次登录算起最多 90 天（到点强制重登）
  refresh_max_lifetime: 2160h
  # 轮换后的旧 token 在 30s 内重放视为多标签页竞态（容忍），超出则按盗用处理
  refresh_reuse_interval: 30s
  bcrypt_cost: 12
  login_max_attempts: 5
  login_lockout: 15m
  login_rps: 5
  login_burst: 10
  # 本地 http 调试必须 false：Secure cookie 不会在 http 上回传，
  # 表现为「登录成功但刷新页面就掉线」。生产（HTTPS）必须 true。
  cookie_secure: false
