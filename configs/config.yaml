# go-web-template 默认开发配置
# 优先级：默认值 < 本文件 < 环境变量（前缀 APP_，如 APP_DATABASE_HOST）
app:
  name: go-web-template
  env: development          # development | staging | production
  debug: true
  port: 8080

http:
  read_timeout: 10s
  # header 阶段的单独超时：slowloris 不能靠一点点发头把连接挂到 read_timeout（上限 = read_timeout）
  read_header_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s
  request_timeout: 15s
  max_body_bytes: 1048576  # 1 MiB
  # 请求头上限（stdlib 默认 1 MiB 太大）：本 API 的头远不到 16 KiB
  max_header_bytes: 16384  # 16 KiB（1..1048576）
  # 可信反向代理（IP/CIDR，逗号分隔）。默认空 = 不信任任何代理：客户端 IP 取 TCP 对端，
  # X-Forwarded-For 一律忽略。否则调用方可自选限流桶、伪造访问日志里的 IP。
  # 部署在 nginx/traefik 之后时填代理网段，例如 ["10.0.0.0/8"]。
  trusted_proxies: []

database:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres
  dbname: go_web_template
  sslmode: disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h
  log_level: warn          # silent | error | warn | info
  # 慢查询阈值：超过它就按 warn 落日志（SQL 语句仍用占位符，不含参数值）
  slow_threshold: 1s

log:
  level: info              # debug | info | warn | error
  format: json             # json | console

cors:
  # allow_credentials=true 时禁止 "*"（浏览器会拒收带凭据的通配来源，refresh cookie 流程
  # 会静默失效）；每项必须是 https://host[:port] 形式，不支持 https://*.example.com 通配。
  allowed_origins:
    - "*"
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization
    - X-Request-ID
  exposed_headers:
    - X-Request-ID
  allow_credentials: false
  max_age: 12h

ratelimit:
  enabled: true
  rps: 100
  burst: 200
  # 桶放哪里：memory = 每进程一份（单实例正确）；redis = 多副本共享。
  # 多副本部署必须用 redis，否则每个副本各有一份额度，等于把限额乘以副本数。
  backend: memory

# Redis 只在 ratelimit.backend=redis 时使用（不是事实来源，DB 永远权威）。
redis:
  addr: ""              # 空 + backend=redis 会在启动时 fail-fast
  password: ""
  db: 0
  pool_size: 10
  dial_timeout: 2s      # 同时作为读写超时：Redis 卡住时快速失败（限流 fail-open）
  ping_timeout: 1s      # 启动连通性检查

swagger:
  enabled: true

metrics:
  # Prometheus 抓取端点 /metrics（含 Go 版本、路由清单与流量画像）。
  # 默认开启；公网部署请关掉（APP_METRICS_ENABLED=false）或让反代只放行抓取方。
  enabled: true

auth:
  # HS256 签名密钥：生产环境必填且 >=32 字节（APP_AUTH_JWT_SECRET），开发环境可用默认值
  jwt_secret: dev-only-insecure-secret-change-me-32b
  # 轮换：新签发的 token 头里带 kid=<jwt_key_id>；旧密钥放 jwt_retired_secrets
  # （只验不签），等 access_ttl 过去后再从列表里删掉。留空 = 不轮换。
  jwt_key_id: ""
  jwt_retired_secrets: []
  issuer: go-web-template
  access_ttl: 15m
  # 滑动续期：每次 /auth/refresh 都会续到 30 天，活跃用户不会被迫重登
  refresh_ttl: 720h
  # 会话绝对上限：从首次登录算起最多 90 天（到点强制重登）
  refresh_max_lifetime: 2160h
  # 轮换后的旧 token 在 30s 内重放视为多标签页竞态（容忍），超出则按盗用处理
  refresh_reuse_interval: 30s
  bcrypt_cost: 12
  # 认证校验缓存：每请求少一次用户行读；本进程写立即失效，多副本最多滞后一个 TTL。
  # 0 = 关闭（每请求一次 DB 读）。上限 1m。
  verify_cache_ttl: 5s
  login_max_attempts: 5
  login_lockout: 15m
  login_rps: 5
  login_burst: 10
  # 改密端点按用户限流（每次都要 bcrypt 校验当前密码）：突发 5 次，之后每 5 秒 1 次
  password_rps: 0.2
  password_burst: 5
  # 镜像里烘焙的默认值必须是 true：这是会随镜像进生产的那份配置。
  # 本地 http 调试由 make dev / make run / make docker-up / smoke.sh 注入
  # APP_AUTH_COOKIE_SECURE=false（Secure cookie 在 http 上不会回传，
  # 表现为「登录成功但刷新页面就掉线」）。手工 docker compose up 时 compose
  # 同样默认 true，需要自己 export false。
  cookie_secure: true


message:
  # 后台投递 worker 由 cmd/server 启动；关闭后 delivery 会停留在 pending
  worker_enabled: true
  poll_interval: 5s
  batch_size: 50
  lease: 2m
  retry_base: 30s
  delivery_timeout: 30s
  webhook_urls: []
  webhook_secret: ""
  webhook_allow_private: false
  mail:
    host: ""
    port: 587
    username: ""
    password: ""
    from: ""
    # 必须 STARTTLS；production 不允许 false（明文中继 = 凭据和正文裸奔）。
    # 本地 MailHog/Mailpit 等无 TLS 的收件服务显式置 false。
    require_tls: true
  sms:
    provider: ""
    account_sid: ""
    auth_token: ""
    from: ""
    endpoint: ""
  default_locale: zh-CN
  max_attempts: 5

retention:
  # 保留期清理 worker（housekeeping）：cmd/server 启动，按窗口硬删除过期行。
  # 关闭后表会无界增长；窗口都从「可清理时刻」起算（token/消息=过期时间，
  # 终态投递=最后更新时间），所以再过一段宽限期才真正删除。
  enabled: true
  interval: 1h
  timeout: 1m                  # 单个任务的上限，避免大 DELETE 长时间占用
  refresh_token_retention: 168h   # 过期后再留 7 天（重放判定仍有明确答案）
  delivery_retention: 720h        # sent/dead/canceled 保留 30 天；pending/可重试永不删
  message_retention: 2160h        # 消息自身 expires_at 之后再留 90 天；无 expires_at 永不删

storage:
  # 文件存储：local = 本地磁盘（默认，开箱可跑）；s3 = 任意 S3 兼容端点
  # （MinIO / 阿里云 OSS / Cloudflare R2；OSS 用 S3 协议接入，不用原生 SDK）。
  driver: local
  # 单文件上限（与 http.max_body_bytes 分开：JSON 保持 1 MiB，上传按需放宽）
  max_upload_bytes: 10485760   # 10 MiB
  # 允许的类型：客户端 Content-Type 不被信任，服务端嗅探后必须命中这里的白名单
  allowed_mime:
    - image/png
    - image/jpeg
    - image/webp
    - image/gif
    - application/pdf
    - text/plain
    - application/zip
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  allowed_ext: [".png", ".jpg", ".jpeg", ".webp", ".gif", ".pdf", ".txt", ".zip", ".docx", ".xlsx"]
  # 可内联渲染的类型：其余强制 Content-Disposition: attachment（上传的 SVG/HTML
  # 直接内联渲染等于在 API 域上存了一个 XSS）
  inline_mime: [image/png, image/jpeg, image/webp, image/gif, application/pdf]
  # 本地下载 URL 的 HMAC 签名密钥（APP_STORAGE_SIGNING_SECRET）。仓库内默认值只用于
  # development；production 必须替换为 >=32 字节的随机值，否则启动失败。
  signing_secret: dev-only-insecure-storage-secret-change-me-32b
  # 上传后超期仍未被任何业务引用的「孤儿文件」多久后清理（后台任务）
  orphan_ttl: 24h
  local:
    root: .local/uploads        # 已被 .gitignore，不要把用户文件放进仓库
    base_url: http://localhost:8080   # 签名下载 URL 的绝对前缀（部署时的公网入口）
  # 长期资产链接（file_shares）：随机 token，可撤销、可永久有效；缓存时间即撤销最坏延迟
  assets:
    base_url: ""                # 空 = storage.local.base_url；生产填 CDN/反代 origin
    cache_ttl: 24h
  # 资产 token 的随机字节数（16..64，默认 32 = 43 字符 base64url）
  public_token_bytes: 32
  # 上传保护：按用户限流 + 24h 窗口限次数/字节数（0 = 不限）
  upload_rps: 2
  upload_burst: 10
  upload_daily_files: 200
  upload_daily_bytes: 104857600   # 100 MiB / 24h / user
  s3:
    endpoint: ""                # 空 = AWS；MinIO/OSS 填对应 endpoint
    region: us-east-1
    bucket: ""
    access_key: ""              # 生产建议留空走环境变量/IAM，不要写进配置文件
    secret_key: ""
    use_path_style: false       # MinIO 需要 true
    presign_ttl: 10m            # SigV4 上限 7 天

otel:
  # 分布式追踪（OpenTelemetry → OTLP gRPC）。默认关闭：没有 collector 也能跑。
  # 本地看效果用 make observability-up（自动指向 Tempo）；生产建议 sample_ratio 0.05–0.2。
  enabled: false
  endpoint: 127.0.0.1:4317
  insecure: true            # 本地 compose / sidecar 明文 gRPC；跨网络请置 false 并配 TLS
  sample_ratio: 1.0         # head-based，0 < ratio <= 1
  service_name: ""          # 空 = app.name
