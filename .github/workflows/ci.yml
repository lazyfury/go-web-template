name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# 工具版本必须与 Makefile 顶部一致；升级时两处同步（CI 用 pin 版本，不用 latest）
env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint (v2 config)
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  gate:
    name: Format / Vet / Test / Build / OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 与本地 `make check` 同款：gofmt 校验 + vet + race 测试 + build + OpenAPI 黄金文件
      - name: make gate
        run: make gate

  web:
    name: Web (typecheck & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm (version from web/admin packageManager)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/admin/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/admin/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  docker:
    name: Docker E2E (compose)
    runs-on: ubuntu-latest
    needs: [gate, web]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Covers image build + compose wiring (postgres → migrate → app) and
      # proves migrations actually run on a fresh volume.
      - name: Compose up
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz || true)
            if [ "$code" = "200" ]; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "app did not become ready in 60s"
          exit 1

      - name: CRUD smoke
        run: |
          set -euo pipefail
          created=$(curl -fsS -X POST http://127.0.0.1:8080/api/v1/users \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI User","email":"ci@example.com"}')
          echo "$created" | grep -q '"code":0'
          id=$(printf '%s' "$created" | sed -n 's/.*"id":\([0-9]*\).*/\1/p')
          test -n "$id"

          curl -fsS "http://127.0.0.1:8080/api/v1/users/$id" | grep -q 'CI User'
          curl -fsS "http://127.0.0.1:8080/api/v1/users?keyword=ci@example.com" | grep -q '"total":1'
          curl -fsS -X DELETE -o /dev/null "http://127.0.0.1:8080/api/v1/users/$id"

          # Validation and body-limit contracts.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/users \
            -H 'Content-Type: application/json' -d '{"name":"","email":"nope"}')" = "400"
          # Stream the oversized body from a file: passing 2 MB via argv
          # exceeds ARG_MAX on some runners ("Argument list too long").
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          {
            printf '{"name":"'
            head -c 2000000 /dev/zero | tr '\0' 'a'
            printf '","email":"ci@example.com"}'
          } > "$body"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/users \
            -H 'Content-Type: application/json' --data-binary "@$body")" = "413"

      - name: App logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-log-prefix

      - name: Compose down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
