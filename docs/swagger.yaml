basePath: /api/v1
definitions:
  github_com_example_go-web-template_internal_errors.Code:
    enum:
    - 0
    - 40000
    - 40100
    - 40300
    - 40400
    - 40900
    - 42900
    - 50000
    - 50001
    type: integer
    x-enum-varnames:
    - CodeOK
    - CodeInvalidArgument
    - CodeUnauthorized
    - CodeForbidden
    - CodeNotFound
    - CodeConflict
    - CodeTooManyRequests
    - CodeInternal
    - CodeDatabase
  github_com_example_go-web-template_internal_response.Body:
    properties:
      code:
        $ref: '#/definitions/github_com_example_go-web-template_internal_errors.Code'
      data: {}
      message:
        type: string
    type: object
  internal_handler.CreateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
    required:
    - email
    - name
    type: object
  internal_handler.UpdateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: 'Industry-standard Go web monolith template: Gin + GORM + PostgreSQL
    + zap.'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Go Web Template API
  version: 1.0.0
paths:
  /users:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        maximum: 100
        name: page_size
        type: integer
      - description: Keyword matched against name/email
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_internal_response.Body'
      summary: List users with pagination and keyword filter
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: User payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_internal_response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_internal_response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_internal_response.Body'
      summary: Create a user
      tags:
      - users
  /users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: no content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_internal_response.Body'
      summary: Delete a user (soft delete)
      tags:
      - users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_internal_response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_internal_response.Body'
      summary: Get a user by id
      tags:
      - users
    patch:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_internal_response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_internal_response.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_internal_response.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_internal_response.Body'
      summary: Update a user
      tags:
      - users
schemes:
- http
- https
swagger: "2.0"
