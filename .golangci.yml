# golangci-lint v2 配置（v1 的 linters-settings / exclude-use-default 已废弃）
# 版本要求: golangci-lint v2.15.0 — `make tools` 是唯一来源，避免 latest 漂移导致红灯
version: "2"
run:
  tests: true
  timeout: 5m
linters:
  enable:
    - bodyclose
    - gocritic
    - misspell
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - whitespace
  disable:
    - funlen
    - gochecknoglobals
    - gochecknoinits
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          severity: warning
        # 守门：包注释必须以 "Package <name>" 开头，防止改包名/搬包后注释漂移
        - name: package-comments
          severity: warning
  exclusions:
    generated: lax
    paths:
      - docs
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/example/go-web-template
  exclusions:
    generated: lax
    paths:
      - docs
      - third_party$
      - builtin$
      - examples$
