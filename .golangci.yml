# golangci-lint 配置
# 版本要求: golangci-lint >= 1.60

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - gofmt
    - goimports
    - misspell
    - gocritic
    - revive
    - bodyclose
    - noctx
    - unconvert
    - prealloc
    - whitespace
    - stylecheck
  disable:
    - gochecknoglobals
    - gochecknoinits
    - funlen

linters-settings:
  goimports:
    local-prefixes: github.com/example/go-web-template
  revive:
    rules:
      - name: exported
        severity: warning
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
  misspell:
    locale: US

issues:
  exclude-dirs:
    - docs
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
